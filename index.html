<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real1adeef's Web</title>
  <style>
    :root {
      --mouse-x: 50vw;
      --mouse-y: 50vh;
      --glow-size: 25px; /* Exact 100px spotlight */
      --glow-opacity: 0.85;
      --rgb-hue: 200deg;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      background-color: #060810;
      position: relative;
    }

    /* Base deep dark background */
    .bg-base {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: radial-gradient(ellipse at 50% 50%, #0c1022 0%, #04050a 100%);
    }

    /* Infinite Looping Animated Cyber Lines */
    .lines-loop {
      position: fixed;
      inset: -100px;
      z-index: 1;
      pointer-events: none;
      background-image: 
        linear-gradient(rgba(56, 189, 248, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(168, 85, 247, 0.07) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: moveLines 12s linear infinite;
      mask-image: radial-gradient(circle at 50% 50%, black 40%, transparent 90%);
      -webkit-mask-image: radial-gradient(circle at 50% 50%, black 40%, transparent 90%);
    }

    @keyframes moveLines {
      0% {
        transform: translate(0, 0);
      }
      100% {
        transform: translate(50px, 50px);
      }
    }

    /* 100px Mouse / Touch RGB Glow */
    .mouse-spotlight {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      opacity: var(--glow-opacity);
      background: radial-gradient(
        var(--glow-size) circle at var(--mouse-x) var(--mouse-y),
        hsl(var(--rgb-hue), 100%, 65%) 0%,
        hsl(calc(var(--rgb-hue) + 45deg), 100%, 55%) 35%,
        hsl(calc(var(--rgb-hue) + 90deg), 90%, 45%) 65%,
        transparent 100%
      );
      mix-blend-mode: screen;
      filter: blur(4px);
      transition: opacity 0.4s ease-out;
      will-change: background, opacity;
    }

    /* Content Card */
    .container {
      position: relative;
      z-index: 3;
      text-align: center;
      padding: 3rem 2.5rem;
      border-radius: 20px;
      background: rgba(10, 14, 26, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      max-width: 620px;
      margin: 20px;
      transition: transform 0.25s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .container:hover {
      border-color: rgba(255, 255, 255, 0.18);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 25px rgba(56, 189, 248, 0.12);
      transform: translateY(-2px);
    }

    h1 {
      font-size: 2.75rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.8rem;
      background: linear-gradient(135deg, #38bdf8 0%, #c084fc 50%, #f472b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: #94a3b8;
      font-size: 1.15rem;
      line-height: 1.7;
    }
    /* Hide default OS cursor */
body, * {
  cursor: none !important;
}

/* Custom Cursor: Center Dot */
.custom-cursor-dot {
  position: fixed;
  top: 0;
  left: 0;
  width: 8px;
  height: 8px;
  background-color: #38bdf8;
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%, -50%);
  transition: transform 0.1s ease-out;
}

/* Custom Cursor: Outer Ring with RGB glow */
.custom-cursor-ring {
  position: fixed;
  top: 0;
  left: 0;
  width: 32px;
  height: 32px;
  border: 1.5px solid rgba(56, 189, 248, 0.7);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9998;
  transform: translate(-50%, -50%);
  transition: width 0.2s ease, height 0.2s ease, border-color 0.2s ease;
  box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
}

/* Expanding ring effect on click or hover */
.custom-cursor-ring.active {
  width: 48px;
  height: 48px;
  border-color: #ec4899;
  box-shadow: 0 0 15px rgba(236, 72, 153, 0.6);
}
  </style>
</head>
<body>

  <!-- Background Layers -->
  <div class="bg-base"></div>
  <div class="lines-loop"></div>
  <div class="mouse-spotlight"></div>

  <!-- Content Card -->
  <main class="container">
    <h1>Real1adeef</h1>
    <p>Work in progress. Software, videos, and demos coming soon.</p>
  </main>
<div class="custom-cursor-dot" id="cursorDot"></div>
<div class="custom-cursor-ring" id="cursorRing"></div>
  <script>
    const cursorDot = document.getElementById('cursorDot');
const cursorRing = document.getElementById('cursorRing');

window.addEventListener('pointermove', (e) => {
  const posX = e.clientX;
  const posY = e.clientY;

  // Immediate dot movement
  cursorDot.style.left = `${posX}px`;
  cursorDot.style.top = `${posY}px`;

  // Smooth ring follow via Web Animations API
  cursorRing.animate({
    left: `${posX}px`,
    top: `${posY}px`
  }, { duration: 250, fill: "forwards" });
});

// Click expand animation
window.addEventListener('pointerdown', () => cursorRing.classList.add('active'));
window.addEventListener('pointerup', () => cursorRing.classList.remove('active'));
    const root = document.documentElement;
    let fadeTimer;
    let currentHue = 190;

    function onPointerAction(x, y) {
      // Set exact cursor coordinates
      root.style.setProperty('--mouse-x', `${x}px`);
      root.style.setProperty('--mouse-y', `${y}px`);

      // Cycle RGB color on movement
      currentHue = (currentHue + 1.5) % 360;
      root.style.setProperty('--rgb-hue', `${currentHue}deg`);

      // Keep it visible and sharp while moving
      root.style.setProperty('--glow-opacity', '0.85');

      // Softly dim if stopped
      clearTimeout(fadeTimer);
      fadeTimer = setTimeout(() => {
        root.style.setProperty('--glow-opacity', '0.35');
      }, 700);
    }

    // Pointer events (handles Mouse + Touch automatically)
    window.addEventListener('pointermove', (e) => {
      onPointerAction(e.clientX, e.clientY);
    });

    window.addEventListener('pointerdown', (e) => {
      onPointerAction(e.clientX, e.clientY);
    });
  </script>

</body>
</html>
