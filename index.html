<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real1adeef's Web</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;

      /* Dark RGB Ambient Animated Gradient */
      background: linear-gradient(-45deg, #090a0f, #12072b, #031b24, #08120c);
      background-size: 400% 400%;
      animation: darkRgbShift 14s ease infinite;
    }

    @keyframes darkRgbShift {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    /* Ambient glowing background blobs for extra depth */
    .glow-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      background: 
        radial-gradient(circle at 20% 30%, rgba(138, 43, 226, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(0, 210, 255, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 50% 90%, rgba(255, 0, 128, 0.12) 0%, transparent 40%);
    }

    /* Main Container / Content Area */
    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2.5rem;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
      max-width: 600px;
      margin: 20px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.8rem;
      /* Subtle RGB gradient on the heading text */
      background: linear-gradient(90deg, #38bdf8, #a855f7, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: #94a3b8;
      font-size: 1.1rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <!-- Ambient Light Effect -->
  <div class="glow-overlay"></div>

  <!-- Your Future Content Goes Here -->
  <main class="container">
    <h1>Real1adeef</h1>
    <p>Work in progress. Software, videos, and demos coming soon.</p>
  </main>

</body>
</html>
